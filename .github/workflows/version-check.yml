name: Version Bump Check

on:
  pull_request:
    branches: [main]

jobs:
  check-version:
    name: Version Bump Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          set -euo pipefail

          MANIFEST=.claude-plugin/plugin.json
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE_REF"

          PR_VERSION=$(jq -r '.version // empty' "$MANIFEST")
          MAIN_VERSION=$(git show "origin/$BASE_REF:$MANIFEST" 2>/dev/null | jq -r '.version // empty' || true)

          if [ -z "$PR_VERSION" ]; then
            echo "::error::Could not read version from $MANIFEST."
            exit 1
          fi

          echo "PR version:   $PR_VERSION"
          echo "Base version: ${MAIN_VERSION:-none}"

          if [ -z "$MAIN_VERSION" ]; then
            echo "✓ No plugin manifest on base branch — first version: $PR_VERSION"
            exit 0
          fi

          IFS='.' read -r PR_MAJOR PR_MINOR PR_PATCH <<< "$PR_VERSION"
          IFS='.' read -r MAIN_MAJOR MAIN_MINOR MAIN_PATCH <<< "$MAIN_VERSION"

          if (( PR_MAJOR < MAIN_MAJOR )) || \
             (( PR_MAJOR == MAIN_MAJOR && PR_MINOR < MAIN_MINOR )) || \
             (( PR_MAJOR == MAIN_MAJOR && PR_MINOR == MAIN_MINOR && PR_PATCH <= MAIN_PATCH )); then
            echo "::error::Version must be greater than base. Got $PR_VERSION, base has $MAIN_VERSION. Installed copies only update when the version changes."
            exit 1
          fi

          echo "✓ Version bumped: $MAIN_VERSION → $PR_VERSION"
